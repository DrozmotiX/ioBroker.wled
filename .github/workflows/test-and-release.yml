name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
    push:
        branches:
            - 'main'
        tags:
            # normal versions
            - 'v[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed.
# Release runs (tag pushes) are never cancelled - cancelling them aborts the deploy job and
# leaves the release half finished, which the ioBroker repo checker reports as W3032.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Restrict the default GITHUB_TOKEN to read-only; the deploy job widens this for itself.
permissions:
    contents: read

jobs:
    # Performs quick checks before the expensive test runs
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: '24.x'
                  # Uncomment the following line if your adapter cannot be installed using 'npm ci'
                  # install-command: 'npm install'
                  lint: true

    # Runs adapter tests on all supported node versions and OSes
    adapter-tests:
        needs: [check-and-lint]
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            # Do not cancel the remaining matrix legs when one of them fails,
            # otherwise a single flaky OS/node combination hides all other results
            fail-fast: false
            matrix:
                node-version: [22.x, 24.x]
                os: [ubuntu-latest, windows-latest, macos-latest]

        steps:
            - uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}
                  # Uncomment the following line if your adapter cannot be installed using 'npm ci'
                  # install-command: 'npm install'

    # NOTE: Automatic npm releases are configured via npm Trusted Publishing (OIDC)
    # using ioBroker/testing-action-deploy@v1 and the id-token permission below.
    # Ensure your npm package is set up for GitHub OIDC; no NPM_TOKEN secret is required.

    # Deploys the final package to NPM
    deploy:
        needs: [check-and-lint, adapter-tests]

        # Trigger this step only when a commit on any branch is tagged with a version number
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')

        runs-on: ubuntu-latest

        # Permissions:
        # - contents: write   → required to create GitHub releases
        # - id-token: write   → required for NPM trusted publishing (OIDC)
        permissions:
            contents: write
            id-token: write

        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: '24.x'
                  # Uncomment the following line if your adapter cannot be installed using 'npm ci'
                  # install-command: 'npm install'
                  # npm-token is intentionally omitted - using NPM trusted publishing instead
                  github-token: ${{ secrets.GITHUB_TOKEN }}

                  # Sentry release notification
                  sentry: true
                  sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  sentry-url: https://sentry.iobroker.net
                  sentry-org: iobroker
                  sentry-project: iobroker-wled
                  sentry-version-prefix: iobroker.wled
