<svg xmlns="http://www.w3.org/2000/svg" width="800" height="485" viewBox="0 0 800 485" role="img" aria-labelledby="t">
<title id="t">Ablauf: Gerät entfernen und Wiederauftauchen per Bonjour</title>
<style>
.bg{fill:#ffffff}.box{fill:#f3f6fa;stroke:#4a6a8a;stroke-width:1.5}.ok{fill:#e8f5e9;stroke:#3c8c47}.warn{fill:#fff4e5;stroke:#c77700}.q{fill:#eef1ff;stroke:#4b5bbf}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:#1f2933}.h{font-weight:600}.s{font-size:12px;fill:#52606d}.m{font-family:Menlo,Consolas,monospace;font-size:12px}
.ln{stroke:#52606d;stroke-width:1.5;fill:none;marker-end:url(#a)}.lbl{font-size:12px;fill:#52606d}
@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.box{fill:#161b22;stroke:#8aa4c0}.ok{fill:#12261a;stroke:#5cb46a}.warn{fill:#2b1d07;stroke:#e09a33}.q{fill:#171c36;stroke:#8b97e6}text{fill:#e6edf3}.s,.lbl{fill:#9aa5b1}.ln{stroke:#9aa5b1}#a path{fill:#9aa5b1}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#52606d"/></marker></defs>
<rect class="bg" width="100%" height="100%" rx="8"/>
<text x="400" y="28" text-anchor="middle" class="h">Gerät entfernen und warum es wiederkommen kann</text><rect class="box " x="20" y="50" width="180" height="54" rx="6"/><text x="110" y="73" text-anchor="middle" class="h">Reiter „Geräte“</text><text x="110" y="91" text-anchor="middle" class="s">Papierkorb</text><polyline class="ln" points="110,104 110,120 400,120 400,138"/><rect class="box " x="215" y="50" width="180" height="54" rx="6"/><text x="305" y="73" text-anchor="middle" class="h">Instanzeinstellungen</text><text x="305" y="91" text-anchor="middle" class="s">Spalte „Entfernen“</text><polyline class="ln" points="305,104 305,120 400,120 400,138"/><rect class="box " x="410" y="50" width="180" height="54" rx="6"/><text x="500" y="73" text-anchor="middle" class="h">Reiter „Objekte“</text><text x="500" y="91" text-anchor="middle" class="s">Geräteobjekt löschen</text><polyline class="ln" points="500,104 500,120 400,120 400,138"/><rect class="box " x="605" y="50" width="180" height="54" rx="6"/><text x="695" y="73" text-anchor="middle" class="h">Skript</text><text x="695" y="91" text-anchor="middle" class="s">sendTo deleteDevice</text><polyline class="ln" points="695,104 695,120 400,120 400,138"/><rect class="box " x="170" y="140" width="460" height="62" rx="6"/><text x="400" y="167" text-anchor="middle" class="">Adapter löscht wled.&lt;Instanz&gt;.&lt;MAC&gt; mit allen Datenpunkten</text><text x="400" y="185" text-anchor="middle" class="s">und stoppt Watchdog, Timer und WebSocket</text><polyline class="ln" points="400,202 400,228"/><rect class="box q" x="250" y="230" width="300" height="50" rx="6"/><text x="400" y="260" text-anchor="middle" class="h">Läuft das Gerät noch in deinem Netz?</text><polyline class="ln" points="250,255 140,255 140,308"/><text class="lbl" x="170" y="248">Nein</text><rect class="box ok" x="30" y="310" width="220" height="54" rx="6"/><text x="140" y="342" text-anchor="middle" class="h">Gerät bleibt entfernt</text><polyline class="ln" points="550,255 640,255 640,308"/><text class="lbl" x="585" y="248">Ja</text><rect class="box warn" x="480" y="310" width="300" height="62" rx="6"/><text x="630" y="337" text-anchor="middle" class="">Bonjour findet es wieder: beim Adapter-</text><text x="630" y="355" text-anchor="middle" class="">start oder bei „Neue Geräte suchen“</text><polyline class="ln" points="630,372 630,398"/><rect class="box warn" x="480" y="400" width="300" height="62" rx="6"/><text x="630" y="427" text-anchor="middle" class="">Adapter legt es neu an, unter</text><text x="630" y="445" text-anchor="middle" class="">derselben MAC mit neuen Datenpunkten</text>
</svg>
