<svg xmlns="http://www.w3.org/2000/svg" width="780" height="680" viewBox="0 0 780 680" role="img" aria-labelledby="titel beschreibung">
<title id="titel">So kommt ein Befehl beim WLED-Gerät an</title>
<desc id="beschreibung">Ablauf: Ein geschriebener Wert wird nur mit ack=false gesendet und nur an ein Gerät, das der Adapter als verbunden kennt. Dann geht er per WebSocket oder per HTTP an das Gerät. WLED meldet seinen Zustand zurück, der Datenpunkt bekommt ack=true. Es gibt keine Warteschlange und keine Wiederholung.</desc>
<defs><marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs>
<rect x="0" y="0" width="780" height="680" rx="12" fill="#ffffff"/>
<rect x="250" y="20" width="260" height="50" rx="8" fill="#eef2f7" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="380" y="45.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Skript, VIS oder Objektbaum schreibt</text>
<line x1="380" y1="70" x2="380" y2="100" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<polygon points="380,100 490,140 380,180 270,140" fill="#fff8e1" stroke="#f0b429" stroke-width="1.5"/>
<text x="380" y="130.9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Geschrieben</text>
<text x="380" y="149.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">mit ack=false?</text>
<line x1="490" y1="140" x2="560" y2="140" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="533" y="128.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">nein</text>
<rect x="560" y="110" width="200" height="60" rx="8" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="660" y="131.6" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Nicht gesendet: gilt als</text>
<text x="660" y="148.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Rückmeldung vom Gerät</text>
<line x1="380" y1="180" x2="380" y2="230" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="396" y="205.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">ja</text>
<polygon points="380,230 490,270 380,310 270,270" fill="#fff8e1" stroke="#f0b429" stroke-width="1.5"/>
<text x="380" y="260.9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Gerät für den</text>
<text x="380" y="279.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Adapter verbunden?</text>
<line x1="490" y1="270" x2="560" y2="270" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="533" y="258.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">nein</text>
<rect x="560" y="225" width="200" height="90" rx="8" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="660" y="244.7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Bis v0.9.2: HTTP-Versuch,</text>
<text x="660" y="261.6" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">scheitert, Fehler im Log</text>
<text x="660" y="278.4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Ab v0.9.3: verworfen,</text>
<text x="660" y="295.4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Warnung im Log</text>
<line x1="380" y1="310" x2="380" y2="350" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="396" y="330.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">ja</text>
<polygon points="380,350 490,390 380,430 270,390" fill="#fff8e1" stroke="#f0b429" stroke-width="1.5"/>
<text x="380" y="380.9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">WebSocket-</text>
<text x="380" y="399.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Verbindung offen?</text>
<polyline points="270,390 190,390 190,460" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="225" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">ja</text>
<polyline points="490,390 570,390 570,460" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="535" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">nein</text>
<rect x="90" y="460" width="200" height="50" rx="8" fill="#e3f2fd" stroke="#4a90d9" stroke-width="1.5"/>
<text x="190" y="485.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">per WebSocket</text>
<rect x="470" y="460" width="200" height="50" rx="8" fill="#e3f2fd" stroke="#4a90d9" stroke-width="1.5"/>
<text x="570" y="476.6" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">per HTTP an</text>
<text x="570" y="493.4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">http://192.168.x.y/json</text>
<line x1="190" y1="510" x2="190" y2="560" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<line x1="570" y1="510" x2="570" y2="560" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<rect x="120" y="560" width="520" height="60" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
<text x="380" y="580.9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">WLED führt den Befehl aus und meldet seinen Zustand.</text>
<text x="380" y="599.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Der Adapter setzt den Datenpunkt auf ack=true.</text>
<text x="380" y="655.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle" dominant-baseline="middle">Keine Warteschlange, keine Wiederholung: Was nicht ankommt, ist verloren.</text>
</svg>
