<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="titel beschreibung">
<title id="titel">WebSocket und HTTP im Vergleich</title>
<desc id="beschreibung">Oben mit WebSocket: Jede Änderung am Gerät kommt sofort beim Adapter an. Im Takt des Intervalls schickt der Adapter nur ein ping, das Gerät antwortet mit pong. Unten ohne WebSocket: Der Adapter fragt das Gerät im Takt des Intervalls per HTTP ab. Eine Änderung am Gerät kommt erst bei der nächsten Abfrage an.</desc>
