<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="titel beschreibung">
<title id="titel">What WLED does when you set ps</title>
<desc id="beschreibung">Flow: if the number is already the active preset, nothing happens, even if the light is off. Otherwise WLED loads the preset. With Include brightness, on/off and brightness are as they were when saved; without it, they stay as they were. To switch on and load a preset in one command, send {"on":true,"ps":3} to action.</desc>
<defs><marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs>
<rect x="0" y="0" width="760" height="580" rx="12" fill="#ffffff"/>
<rect x="250" y="20" width="260" height="50" rx="8" fill="#eef2f7" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="380" y="45.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Number written to ps</text>
<line x1="380" y1="70" x2="380" y2="95" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<polygon points="380,95 510,140 380,185 250,140" fill="#fff8e1" stroke="#f0b429" stroke-width="1.5"/>
<text x="380" y="130.9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Is this number already</text>
<text x="380" y="149.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">the active preset?</text>
<line x1="510" y1="140" x2="560" y2="140" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="535" y="128.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">yes</text>
<rect x="560" y="105" width="190" height="70" rx="8" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="655" y="123.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Nothing happens,</text>
<text x="655" y="140.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">even if the light</text>
<text x="655" y="156.9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">is currently off</text>
<line x1="380" y1="185" x2="380" y2="230" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="402" y="207.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">no</text>
<rect x="190" y="230" width="380" height="50" rx="8" fill="#e3f2fd" stroke="#4a90d9" stroke-width="1.5"/>
<text x="380" y="255.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">WLED loads the preset: color, effect, segments</text>
<line x1="380" y1="280" x2="380" y2="310" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<polygon points="380,310 530,360 380,410 230,360" fill="#fff8e1" stroke="#f0b429" stroke-width="1.5"/>
<text x="380" y="350.9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Saved with</text>
<text x="380" y="369.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">“Include brightness”?</text>
<polyline points="230,360 150,360 150,440" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="190" y="348.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">yes</text>
<polyline points="530,360 610,360 610,440" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="570" y="348.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">no</text>
<rect x="40" y="440" width="220" height="70" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
<text x="150" y="465.9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">On/off and brightness</text>
<text x="150" y="484.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">as when saved</text>
<rect x="500" y="440" width="220" height="70" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
<text x="610" y="465.9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">On/off and brightness</text>
<text x="610" y="484.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">stay as they were</text>
<text x="380" y="550.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle" dominant-baseline="middle">Switch on and load a preset in one command: {"on":true,"ps":3} to the action state</text>
</svg>
