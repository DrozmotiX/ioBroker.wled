<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450" role="img" aria-labelledby="t">
<title id="t">Blockly blocks and the data types they deliver to WLED states</title>
<style>
.bg{fill:#ffffff}.box{fill:#f3f6fa;stroke:#4a6a8a;stroke-width:1.5}.ok{fill:#e8f5e9;stroke:#3c8c47}.warn{fill:#fff4e5;stroke:#c77700}.q{fill:#eef1ff;stroke:#4b5bbf}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:#1f2933}.h{font-weight:600}.s{font-size:12px;fill:#52606d}.m{font-family:Menlo,Consolas,monospace;font-size:12px}
.ln{stroke:#52606d;stroke-width:1.5;fill:none;marker-end:url(#a)}.lbl{font-size:12px;fill:#52606d}
@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.box{fill:#161b22;stroke:#8aa4c0}.ok{fill:#12261a;stroke:#5cb46a}.warn{fill:#2b1d07;stroke:#e09a33}.q{fill:#171c36;stroke:#8b97e6}text{fill:#e6edf3}.s,.lbl{fill:#9aa5b1}.ln{stroke:#9aa5b1}#a path{fill:#9aa5b1}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#52606d"/></marker></defs>
<rect class="bg" width="100%" height="100%" rx="8"/>
<text x="410" y="28" text-anchor="middle" class="h">Which block delivers which data type?</text><text x="120" y="56" text-anchor="middle" class="s">Blockly block / value in a script</text><text x="410" y="56" text-anchor="middle" class="s">Data type</text><text x="680" y="56" text-anchor="middle" class="s">used for</text><rect class="box ok" x="20" y="68" width="220" height="48" rx="6"/><text x="130" y="88" text-anchor="middle" class="">Logic: “true” / “false”</text><text x="130" y="106" text-anchor="middle" class="m">true</text><polyline class="ln" points="240,92 318,92"/><rect class="box ok" x="320" y="68" width="180" height="48" rx="6"/><text x="410" y="97" text-anchor="middle" class="h">boolean</text><polyline class="ln" points="500,92 548,92"/><rect class="box ok" x="550" y="68" width="250" height="48" rx="6"/><text x="675" y="97" text-anchor="middle" class="">on</text><rect class="box ok" x="20" y="130" width="220" height="48" rx="6"/><text x="130" y="150" text-anchor="middle" class="">Math: number</text><text x="130" y="168" text-anchor="middle" class="m">128</text><polyline class="ln" points="240,154 318,154"/><rect class="box ok" x="320" y="130" width="180" height="48" rx="6"/><text x="410" y="159" text-anchor="middle" class="h">number</text><polyline class="ln" points="500,154 548,154"/><rect class="box ok" x="550" y="130" width="250" height="48" rx="6"/><text x="675" y="159" text-anchor="middle" class="">bri, ps, pl, transition</text><rect class="box ok" x="20" y="192" width="220" height="48" rx="6"/><text x="130" y="212" text-anchor="middle" class="">Text: [255,0,0]</text><text x="130" y="230" text-anchor="middle" class="m">'[255,0,0]'</text><polyline class="ln" points="240,216 318,216"/><rect class="box ok" x="320" y="192" width="180" height="48" rx="6"/><text x="410" y="221" text-anchor="middle" class="h">text (string)</text><polyline class="ln" points="500,216 548,216"/><rect class="box ok" x="550" y="192" width="250" height="48" rx="6"/><text x="675" y="221" text-anchor="middle" class="">seg.&lt;segment&gt;.col.0 / .1 / .2</text><rect class="box ok" x="20" y="254" width="220" height="48" rx="6"/><text x="130" y="274" text-anchor="middle" class="">Text: #ff0000</text><text x="130" y="292" text-anchor="middle" class="m">'#ff0000'</text><polyline class="ln" points="240,278 318,278"/><rect class="box ok" x="320" y="254" width="180" height="48" rx="6"/><text x="410" y="283" text-anchor="middle" class="h">text (string)</text><polyline class="ln" points="500,278 548,278"/><rect class="box ok" x="550" y="254" width="250" height="48" rx="6"/><text x="675" y="283" text-anchor="middle" class="">seg.&lt;segment&gt;.col.0_HEX</text><rect class="box warn" x="20" y="316" width="220" height="48" rx="6"/><text x="130" y="336" text-anchor="middle" class="">Text: true</text><text x="130" y="354" text-anchor="middle" class="m">'true'</text><polyline class="ln" points="240,340 318,340"/><rect class="box warn" x="320" y="316" width="180" height="48" rx="6"/><text x="410" y="345" text-anchor="middle" class="h">text (string)</text><polyline class="ln" points="500,340 548,340"/><rect class="box warn" x="550" y="316" width="250" height="48" rx="6"/><text x="675" y="345" text-anchor="middle" class="">on expects boolean: warning</text><rect class="box warn" x="20" y="378" width="220" height="48" rx="6"/><text x="130" y="398" text-anchor="middle" class="">Lists: create list</text><text x="130" y="416" text-anchor="middle" class="m">[255,0,0]</text><polyline class="ln" points="240,402 318,402"/><rect class="box warn" x="320" y="378" width="180" height="48" rx="6"/><text x="410" y="407" text-anchor="middle" class="h">list (object)</text><polyline class="ln" points="500,402 548,402"/><rect class="box warn" x="550" y="378" width="250" height="48" rx="6"/><text x="675" y="407" text-anchor="middle" class="">color expects text: warning</text>
</svg>
