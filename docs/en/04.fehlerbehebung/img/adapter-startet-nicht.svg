<svg xmlns="http://www.w3.org/2000/svg" width="820" height="612" viewBox="0 0 820 612" role="img" aria-labelledby="t">
<title id="t">Decision tree: adapter doesn't start after an update</title>
<style>
.bg{fill:#ffffff}.box{fill:#f3f6fa;stroke:#4a6a8a;stroke-width:1.5}.ok{fill:#e8f5e9;stroke:#3c8c47}.warn{fill:#fff4e5;stroke:#c77700}.q{fill:#eef1ff;stroke:#4b5bbf}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:#1f2933}.h{font-weight:600}.s{font-size:12px;fill:#52606d}.m{font-family:Menlo,Consolas,monospace;font-size:12px}
.ln{stroke:#52606d;stroke-width:1.5;fill:none;marker-end:url(#a)}.lbl{font-size:12px;fill:#52606d}
@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.box{fill:#161b22;stroke:#8aa4c0}.ok{fill:#12261a;stroke:#5cb46a}.warn{fill:#2b1d07;stroke:#e09a33}.q{fill:#171c36;stroke:#8b97e6}text{fill:#e6edf3}.s,.lbl{fill:#9aa5b1}.ln{stroke:#9aa5b1}#a path{fill:#9aa5b1}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#52606d"/></marker></defs>
<rect class="bg" width="100%" height="100%" rx="8"/>
<text x="410" y="28" text-anchor="middle" class="h">Adapter doesn't start after an update or stops responding</text><rect class="box box" x="30" y="45" width="380" height="40" rx="6"/><text x="220" y="70" text-anchor="middle" class="h">Open the log of the instance and the host</text><polyline class="ln" points="220,85 220,103"/><rect class="box q" x="30" y="105" width="380" height="52" rx="6"/><text x="220" y="136" text-anchor="middle" class="">Installation reports Node.js version too old?</text><polyline class="ln" points="410,131 448,131"/><text class="lbl" x="418" y="125">Yes</text><rect class="box ok" x="450" y="105" width="350" height="52" rx="6"/><text x="625" y="136" text-anchor="middle" class="">Update Node.js, js-controller or Admin</text><polyline class="ln" points="220,157 220,175"/><text class="lbl" x="228" y="170">No</text><rect class="box q" x="30" y="177" width="380" height="52" rx="6"/><text x="220" y="208" text-anchor="middle" class="">Log: Cannot find module '…'?</text><polyline class="ln" points="410,203 448,203"/><text class="lbl" x="418" y="197">Yes</text><rect class="box ok" x="450" y="177" width="350" height="52" rx="6"/><text x="625" y="208" text-anchor="middle" class="">Reinstall the adapter in the “Adapters” tab</text><polyline class="ln" points="220,229 220,247"/><text class="lbl" x="228" y="242">No</text><rect class="box q" x="30" y="249" width="380" height="52" rx="6"/><text x="220" y="271" text-anchor="middle" class="">Log: TypeError … 'initialized' or</text><text x="220" y="289" text-anchor="middle" class="">State attribute … with a crash?</text><polyline class="ln" points="410,275 448,275"/><text class="lbl" x="418" y="269">Yes</text><rect class="box ok" x="450" y="249" width="350" height="52" rx="6"/><text x="625" y="280" text-anchor="middle" class="">Old adapter version: update the adapter</text><polyline class="ln" points="220,301 220,319"/><text class="lbl" x="228" y="314">No</text><rect class="box q" x="30" y="321" width="380" height="52" rx="6"/><text x="220" y="352" text-anchor="middle" class="">Many lines Unable to initialise?</text><polyline class="ln" points="410,347 448,347"/><text class="lbl" x="418" y="341">Yes</text><rect class="box ok" x="450" y="321" width="350" height="52" rx="6"/><text x="625" y="352" text-anchor="middle" class="">Device not reachable: switch on or delete</text><polyline class="ln" points="220,373 220,391"/><text class="lbl" x="228" y="386">No</text><rect class="box q" x="30" y="393" width="380" height="52" rx="6"/><text x="220" y="424" text-anchor="middle" class="">High load, but no error message?</text><polyline class="ln" points="410,419 448,419"/><text class="lbl" x="418" y="413">Yes</text><rect class="box ok" x="450" y="393" width="350" height="52" rx="6"/><text x="625" y="424" text-anchor="middle" class="">Set “Intervall in seconds” to at least 1</text><polyline class="ln" points="220,445 220,463"/><text class="lbl" x="228" y="458">No</text><rect class="box q" x="30" y="465" width="380" height="52" rx="6"/><text x="220" y="496" text-anchor="middle" class="">A device no longer responds after an outage?</text><polyline class="ln" points="410,491 448,491"/><text class="lbl" x="418" y="485">Yes</text><rect class="box ok" x="450" y="465" width="350" height="52" rx="6"/><text x="625" y="496" text-anchor="middle" class="">Restart the instance (affects v0.9.2)</text><polyline class="ln" points="220,517 220,535"/><text class="lbl" x="228" y="530">No</text><rect class="box warn" x="30" y="537" width="770" height="52" rx="6"/><text x="415" y="559" text-anchor="middle" class="">Nothing fits: log level “debug”, restart the instance and attach a log excerpt</text><text x="415" y="577" text-anchor="middle" class="">without IP/MAC to a GitHub issue</text>
</svg>
