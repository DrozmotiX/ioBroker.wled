<svg xmlns="http://www.w3.org/2000/svg" width="780" height="680" viewBox="0 0 780 680" role="img" aria-labelledby="titel beschreibung">
<title id="titel">How a command reaches the WLED device</title>
<desc id="beschreibung">Flow: a written value is only sent with ack=false, and only to a device the adapter knows to be connected. It then goes to the device via WebSocket or via HTTP. WLED reports its state back, and the state gets ack=true. There is no queue and no retry.</desc>
<defs><marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs>
<rect x="0" y="0" width="780" height="680" rx="12" fill="#ffffff"/>
<rect x="250" y="20" width="260" height="50" rx="8" fill="#eef2f7" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="380" y="45.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Script, VIS or object tree writes</text>
<line x1="380" y1="70" x2="380" y2="100" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<polygon points="380,100 490,140 380,180 270,140" fill="#fff8e1" stroke="#f0b429" stroke-width="1.5"/>
<text x="380" y="130.9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Written</text>
<text x="380" y="149.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">with ack=false?</text>
<line x1="490" y1="140" x2="560" y2="140" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="533" y="128.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">no</text>
<rect x="560" y="110" width="200" height="60" rx="8" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="660" y="131.6" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Not sent: counts as</text>
<text x="660" y="148.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">feedback from the device</text>
<line x1="380" y1="180" x2="380" y2="230" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="396" y="205.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">yes</text>
<polygon points="380,230 490,270 380,310 270,270" fill="#fff8e1" stroke="#f0b429" stroke-width="1.5"/>
<text x="380" y="260.9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Device connected</text>
<text x="380" y="279.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">to the adapter?</text>
<line x1="490" y1="270" x2="560" y2="270" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="533" y="258.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">no</text>
<rect x="560" y="225" width="200" height="90" rx="8" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="660" y="244.7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Up to v0.9.2: HTTP attempt</text>
<text x="660" y="261.6" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">fails, error in the log</text>
<text x="660" y="278.4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">From v0.9.3: discarded,</text>
<text x="660" y="295.4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">warning in the log</text>
<line x1="380" y1="310" x2="380" y2="350" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="396" y="330.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">yes</text>
<polygon points="380,350 490,390 380,430 270,390" fill="#fff8e1" stroke="#f0b429" stroke-width="1.5"/>
<text x="380" y="380.9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">WebSocket</text>
<text x="380" y="399.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">connection open?</text>
<polyline points="270,390 190,390 190,460" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="225" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">yes</text>
<polyline points="490,390 570,390 570,460" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<text x="535" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle" dominant-baseline="middle">no</text>
<rect x="90" y="460" width="200" height="50" rx="8" fill="#e3f2fd" stroke="#4a90d9" stroke-width="1.5"/>
<text x="190" y="485.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">via WebSocket</text>
<rect x="470" y="460" width="200" height="50" rx="8" fill="#e3f2fd" stroke="#4a90d9" stroke-width="1.5"/>
<text x="570" y="476.6" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">via HTTP to</text>
<text x="570" y="493.4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">http://192.168.x.y/json</text>
<line x1="190" y1="510" x2="190" y2="560" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<line x1="570" y1="510" x2="570" y2="560" stroke="#7b8794" stroke-width="1.6" marker-end="url(#pfeil)"/>
<rect x="120" y="560" width="520" height="60" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
<text x="380" y="580.9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">WLED runs the command and reports its state.</text>
<text x="380" y="599.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">The adapter sets the state to ack=true.</text>
<text x="380" y="655.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle" dominant-baseline="middle">No queue, no retry: whatever doesn't arrive is lost.</text>
</svg>
